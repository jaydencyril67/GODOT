name: Globe Engine Android Compatibility

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/workflows/globe-engine-android-compatibility.yml

permissions:
  contents: read

concurrency:
  group: globe-engine-android-compatibility
  cancel-in-progress: false

jobs:
  build-android-arm64:
    name: Cross-compile godot-3dtiles for Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out DigitalWorld HQ
        uses: actions/checkout@v4

      - name: Check out pinned godot-3dtiles source
        uses: actions/checkout@v4
        with:
          repository: weixu2015/godot-3dtiles
          ref: 9d68f39ec212b6638cd0e8135cc40325f890e915
          path: vendor/godot-3dtiles
          submodules: recursive
          fetch-depth: 0

      - name: Patch native Android one-finger rotation and two-finger pinch controls
        run: python3 tools/patch_globe_engine_touch.py

      - name: Preserve Android's built-in portable qsort fallback for bundled Zstandard on Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/godot-3dtiles/extern/third_party/CMakeLists.txt")
          text = path.read_text()
          marker = 'target_sources( tiles3d_basisu PRIVATE "${TILES3D_BASISU_DIR}/zstd/zstd.c" )'
          if marker not in text:
              raise SystemExit("Could not locate Basis Universal target source declaration")
          # Android's NDK toolchain exposes _GNU_SOURCE, selecting Zstandard's
          # GNU qsort_r branch even though bionic does not declare qsort_r.
          # Undefine it only for Basis Universal so its portable qsort fallback is used.
          patch = 'target_compile_options( tiles3d_basisu PRIVATE -U_GNU_SOURCE )'
          if patch not in text:
              text = text.replace(marker, marker + "\n" + patch, 1)
          path.write_text(text)
          PY

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018 ndk;28.1.13356709 platform-tools platforms;android-35 build-tools;35.0.1 cmake;3.10.2.4988404

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Verify native build toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "Pinned upstream revision: 9d68f39ec212b6638cd0e8135cc40325f890e915"

      - name: Configure Android ARM64 GDExtension
        shell: bash
        run: |
          set -euo pipefail
          cmake -S vendor/godot-3dtiles -B build/godot-3dtiles-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_ANDROID_STL_TYPE=c++_shared \
            -DGODOTCPP_TARGET=template_release \
            -DGODOTCPP_API_VERSION=4.7 \
            -DGODOTCPP_SYSTEM_HEADERS=ON \
            -DGODOTCPP_ENABLE_TESTING=OFF \
            -DGODOTCPP_WARNING_AS_ERROR=OFF \
            -DBUILD_TESTING=OFF \
            -DGODOT3DTILES_INSTALL_PREFIX="$GITHUB_WORKSPACE/output"

      - name: Build Android ARM64 GDExtension
        run: cmake --build build/godot-3dtiles-android-arm64 --parallel 2

      - name: Install and validate Android native library
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/godot-3dtiles-android-arm64
          mapfile -t LIBRARIES < <(find output -type f -name '*.so' -print)
          if [[ "${#LIBRARIES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Android shared library; found ${#LIBRARIES[@]}."
            find output -maxdepth 8 -type f -print
            exit 1
          fi
          LIBRARY="${LIBRARIES[0]}"
          file "$LIBRARY"
          readelf -h "$LIBRARY" | tee android-library-header.txt
          grep -q 'AArch64' android-library-header.txt
          mkdir -p build/globe-engine-android/addons/lib/Android-aarch64
          cp "$LIBRARY" build/globe-engine-android/addons/lib/Android-aarch64/godot-3dtiles.so
          cp tools/godot-3dtiles.android.gdextension.in build/globe-engine-android/addons/godot-3dtiles.gdextension
          printf '%s\\n' "$LIBRARY" > build/globe-engine-android/library-path.txt
          echo "Android ARM64 native compilation succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "This does not yet prove runtime loading or touch interaction." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android ARM64 compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-3dtiles-android-arm64-compatibility
          path: build/globe-engine-android/
          if-no-files-found: error
          retention-days: 14

      - name: Set up Godot 4.7.2 Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Set up Java for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stage native extension for Android project export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addons/lib/Android-aarch64 addons/lib/linux-x86_64
          cp build/globe-engine-android/addons/lib/Android-aarch64/godot-3dtiles.so addons/lib/Android-aarch64/
          cp tools/godot-3dtiles.android.gdextension.in addons/godot-3dtiles.gdextension
          # The Linux editor host needs a harmless ABI-compatible extension entry
          # while exporting the Android APK. It registers no classes and is never
          # included in the Android package; Android loads the real ARM64 library.
          cat > build/gdextension_editor_stub.cpp <<'CPP'
          #include <cstdint>
          using GDExtensionBool = std::uint8_t;
          using GDExtensionInterfaceGetProcAddress = void *(*)(const char *);
          using GDExtensionClassLibraryPtr = void *;
          enum GDExtensionInitializationLevel : std::uint32_t {
              GDEXTENSION_INITIALIZATION_CORE = 0,
              GDEXTENSION_INITIALIZATION_SERVERS = 1,
              GDEXTENSION_INITIALIZATION_SCENE = 2,
              GDEXTENSION_INITIALIZATION_EDITOR = 3
          };
          struct GDExtensionInitialization {
              GDExtensionInitializationLevel minimum_initialization_level;
              void *userdata;
              void (*initialize)(void *, GDExtensionInitializationLevel);
              void (*deinitialize)(void *, GDExtensionInitializationLevel);
          };
          extern "C" __attribute__((visibility("default")))
          GDExtensionBool GDExtensionInit(
              GDExtensionInterfaceGetProcAddress,
              GDExtensionClassLibraryPtr,
              GDExtensionInitialization *initialization) {
              initialization->minimum_initialization_level = GDEXTENSION_INITIALIZATION_SCENE;
              initialization->userdata = nullptr;
              initialization->initialize = [](void *, GDExtensionInitializationLevel) {};
              initialization->deinitialize = [](void *, GDExtensionInitializationLevel) {};
              return 1;
          }
          CPP
          g++ -std=c++17 -shared -fPIC build/gdextension_editor_stub.cpp -o addons/lib/linux-x86_64/godot-3dtiles.so

      - name: Import project and export Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee android-project-import.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' android-project-import.log; then
            echo "Godot project import failed before Android export."
            exit 1
          fi
          # The native replacement is built for ARM64; do not produce an ARM32
          # variant that cannot load the extension.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("export_presets.cfg")
          content = path.read_text()
          old = "architectures/armeabi-v7a=true"
          if old not in content:
              raise SystemExit("Android export preset architecture setting was not found")
          path.write_text(content.replace(old, "architectures/armeabi-v7a=false", 1))
          PY
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/DigitalWorldMobiles-debug.apk 2>&1 | tee android-export.log
          test -s build/DigitalWorldMobiles-debug.apk
          unzip -l build/DigitalWorldMobiles-debug.apk | tee android-apk-contents.txt
          if ! grep -Eqi 'arm64-v8a.*godot-3dtiles|godot-3dtiles.*arm64-v8a' android-apk-contents.txt; then
            echo "Android APK does not contain the native globe extension."
            exit 1
          fi
          echo "Android ARM64 APK exported with the native globe extension." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DigitalWorld Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalWorldMobiles-Android-ARM64-debug
          path: build/DigitalWorldMobiles-debug.apk
          if-no-files-found: error
          retention-days: 14
