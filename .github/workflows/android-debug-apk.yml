name: DigitalWorld HQ Android Release APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and publish the DigitalWorld HQ Android APK'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: digitalworld-hq-release-apk
  cancel-in-progress: false

jobs:
  build-android-release:
    if: inputs.build_apk
    name: Build Android APK (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Calculate next DigitalWorld HQ release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > releases.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          releases = json.loads(Path("releases.json").read_text())
          versions = []
          for release in releases:
              if release.get("isDraft") or release.get("isPrerelease"):
                  continue
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", release.get("tagName", ""))
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              next_version = (1, 0, 0)
          else:
              major, minor, patch = max(versions)
              if patch < 9:
                  patch += 1
              else:
                  patch = 0
                  if minor < 9:
                      minor += 1
                  else:
                      minor = 0
                      major += 1
              next_version = (major, minor, patch)

          version = ".".join(map(str, next_version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"app_version={version}\n")
          print(f"Next DigitalWorld HQ release version: {version}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          exit "$status"

      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Set DigitalWorld HQ Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()
          text, code_count = re.subn(
              r"(?m)^version/code=\d+$",
              "version/code=" + os.environ["APP_VERSION_CODE"],
              text,
              count=1,
          )
          text, name_count = re.subn(
              r'(?m)^version/name="[^"]*"$',
              'version/name="' + os.environ["APP_VERSION"] + '"',
              text,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set the Android version code and version name.")
          path.write_text(text)
          print(f"Configured DigitalWorld HQ {os.environ['APP_VERSION']} (versionCode {os.environ['APP_VERSION_CODE']})")
          PY

      - name: Verify toolchain and Android preset
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          grep -q '^platform="Android"$' export_presets.cfg || {
            echo "::error::The Android export preset is missing."
            exit 1
          }
          grep -q '^architectures/armeabi-v7a=true$' export_presets.cfg || {
            echo "::error::ARMv7 support is not enabled in the Android preset."
            exit 1
          }
          grep -q '^architectures/arm64-v8a=true$' export_presets.cfg || {
            echo "::error::ARM64 support is not enabled in the Android preset."
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Export Android APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DigitalWorldHQ-debug.apk

      - name: Validate APK integrity, signing, alignment, package and Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/DigitalWorldHQ-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -s "$APK"
          unzip -t "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING"

          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | awk -F"'" '/^package:/{print $2; exit}')"
          MIN_SDK="$(printf '%s\n' "$BADGING" | awk -F"'" '/^sdkVersion:/{print $2; exit}')"

          if [[ "$PACKAGE_NAME" != "org.godotengine.digitalworldhq" ]]; then
            echo "::error::Unexpected Android package name: $PACKAGE_NAME"
            exit 1
          fi

          if [[ -n "$MIN_SDK" && "$MIN_SDK" -gt 30 ]]; then
            echo "::error::APK requires Android API $MIN_SDK, but Android 11 devices support API 30."
            exit 1
          fi

          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/' || {
            echo "::error::APK is missing ARMv7 native libraries."
            exit 1
          }
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || {
            echo "::error::APK is missing ARM64 native libraries."
            exit 1
          }

          echo "APK validation passed: signed, aligned, package ID correct, Android 11 minimum-SDK compatible, ARMv7 + ARM64."

      - name: Prepare release APK and SHA-256 checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          cp build/DigitalWorldHQ-debug.apk DigitalWorldHQ.apk
          test -s DigitalWorldHQ.apk
          sha256sum DigitalWorldHQ.apk > DigitalWorldHQ.apk.sha256
          echo "Prepared DigitalWorldHQ.apk for version $APP_VERSION"
          ls -lh DigitalWorldHQ.apk DigitalWorldHQ.apk.sha256

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: digitalworld-hq-v${{ steps.version.outputs.app_version }}-release-apk
          path: |
            DigitalWorldHQ.apk
            DigitalWorldHQ.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish versioned GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. A new version is required."
            exit 1
          fi

          gh release create "$tag" DigitalWorldHQ.apk DigitalWorldHQ.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "DigitalWorld HQ $APP_VERSION" \
            --notes "DigitalWorld HQ Android release $APP_VERSION.

          Download DigitalWorldHQ.apk and install it on Android. Android may ask you to confirm installation.

          Android version code: ${{ github.run_number }}"
