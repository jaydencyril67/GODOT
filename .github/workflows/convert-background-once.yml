name: One-time background image conversion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert JPG to PNG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image
          source = "Screenshot_20261104-051832_ChatGPT.jpg"
          target = "Screenshot_20261104-051832_ChatGPT.png"
          with Image.open(source) as image:
              image.convert("RGB").save(target, format="PNG", optimize=True)
          PY

      - name: Commit converted PNG and remove JPG
        run: |
          set -euo pipefail
          rm "Screenshot_20261104-051832_ChatGPT.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Screenshot_20261104-051832_ChatGPT.png"
          git add -u "Screenshot_20261104-051832_ChatGPT.jpg"
          git commit -m "Convert replacement background to PNG"
          git push origin HEAD:main
