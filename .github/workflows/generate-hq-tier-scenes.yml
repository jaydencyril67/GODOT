name: Generate Prebuilt HQ Tier Scenes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-hq-tier-scenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit 10 HQ tier scenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Generate all ten headquarters tier scenes
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/generate_hq_tier_scenes.gd 2>&1 | tee hq-scene-generation.log
          for level in $(seq -w 1 10); do
            test -s "scenes/world/headquarters_tiers/level_${level}.tscn"
          done

      - name: Re-import generated scene resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee hq-scene-import.log
          if grep -E 'Parse Error:|SCRIPT ERROR:' hq-scene-import.log; then
            echo "Godot reported an error while importing generated HQ scenes."
            exit 1
          fi

      - name: Validate all ten generated tier scenes
        run: godot --headless --path . --script res://tools/validate_hq_tier_scenes.gd

      - name: Commit generated scenes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scenes/world/headquarters_tiers/
          if git diff --cached --quiet; then
            echo "Generated HQ scenes are already up to date."
            exit 0
          fi
          git commit -m "Generate prebuilt headquarters tier scenes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
