name: Validate 750K Mobile Gaussian SPLAT

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mobile-splat-750k.yml"
      - "assets/3d/Chisel_Create-a-highly-realistic-luxurious-mode_Splat_20261124-120030_750k.ply"
      - "scripts/world/gaussian_splat_office_preview.gd"
      - "scripts/tests/gaussian_splat_office_smoke.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mobile-splat:
    name: Verify the existing 750K SPLAT asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main with Git LFS assets
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Validate the mobile PLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("assets/3d/Chisel_Create-a-highly-realistic-luxurious-mode_Splat_20261124-120030_750k.ply")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("The 750K mobile SPLAT asset is missing or empty.")

          with path.open("rb") as stream:
              header = []
              while True:
                  line = stream.readline()
                  if not line:
                      raise SystemExit("PLY header ended before end_header.")
                  header.append(line)
                  if line.strip() == b"end_header":
                      break

          if not any(line.strip() == b"format binary_little_endian 1.0" for line in header):
              raise SystemExit("The mobile SPLAT must be binary_little_endian PLY.")

          vertex_line = next((line for line in header if line.startswith(b"element vertex ")), None)
          if vertex_line is None or int(vertex_line.split()[2]) != 750_000:
              found = vertex_line.split()[2].decode() if vertex_line else "missing"
              raise SystemExit(f"Expected exactly 750,000 points; found {found}.")

          print(f"Validated {path}: exactly 750,000 points, {path.stat().st_size:,} bytes.")
          PY
