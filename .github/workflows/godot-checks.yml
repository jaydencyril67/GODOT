name: DigitalWorld Godot Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse project and smoke-test startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          # The project-wide theme references an imported font. On a clean
          # checkout, Godot loads project settings before its first import
          # scan, so temporarily disable that theme while generating imports.
          test -s "assets/fonts/STIXTwoText[wght].ttf"
          test -s "assets/company_logos.svg"
          for asset in assets/textures/*.svg; do test -s "$asset"; done
          if grep -R -n --exclude-dir=.git "digitalworld-landing.png" scripts scenes project.godot; then
            echo "A script or scene still references the deleted landing image."
            exit 1
          fi
          cp project.godot project.godot.ci-backup
          restore_project() {
            if [ -f project.godot.ci-backup ]; then
              mv project.godot.ci-backup project.godot
            fi
          }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          restore_project
          trap - EXIT

          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-import.log; then
            echo "Godot reported a script error during asset import."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name 'STIXTwoText*.fontdata' -print -quit | grep -q .; then
            echo "Godot did not generate the imported STIX Two Text font resource."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name '*.ctex' -print -quit | grep -q .; then
            echo "Godot did not generate imported texture resources."
            exit 1
          fi

          # Reopen with the real project theme enabled and validate its resources.
          godot --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-parse.log; then
            echo "Godot reported a script error after imports were generated."
            exit 1
          fi

      - name: Smoke-test Home and Office navigation
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/home_transition_smoke.gd 2>&1 | tee home-office-smoke.log
          grep -q "HOME_OFFICE_TRANSITION_SMOKE_TEST: PASS" home-office-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|HOME_OFFICE_TRANSITION_SMOKE_TEST:.*(FAIL|ERROR)' home-office-smoke.log; then
            echo "Godot reported an error during Home and Office navigation."
            exit 1
          fi

      - name: Smoke-test procedural OS generator and simulator
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --script res://scripts/tests/os_generator_smoke.gd 2>&1 | tee os-generator-smoke.log
          grep -q "OS_GENERATOR_SMOKE_TEST: PASS" os-generator-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|OS_GENERATOR_SMOKE_TEST:.*(FAIL|ERROR)' os-generator-smoke.log; then
            echo "Godot reported an error during the OS generator smoke test."
            exit 1
          fi

      - name: Smoke-test main scene startup
        shell: bash
        run: |
          set +e
          godot --headless --path . --quit-after 5 2>&1 | tee godot-startup.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot startup command exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-startup.log; then
            echo "Godot reported a script error during startup."
            exit 1
          fi

      - name: Report Godot warnings (non-blocking)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          logs=(godot-import.log godot-parse.log home-office-smoke.log os-generator-smoke.log godot-startup.log)
          warning_count=0

          for log in "${logs[@]}"; do
            [ -f "$log" ] || continue
            matches="$(grep -nE 'WARNING:|^[[:space:]]*W [0-9]+:' "$log" || true)"
            [ -n "$matches" ] || continue

            echo "::group::Godot warnings from $log"
            while IFS= read -r warning; do
              printf '::warning::%s\n' "$log: $warning"
              warning_count=$((warning_count + 1))
            done <<< "$matches"
            echo "::endgroup::"
          done

          echo "Godot warning lines reported: $warning_count"
          echo "Warnings are informational and do not fail this workflow."
