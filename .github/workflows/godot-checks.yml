name: DigitalWorld Godot Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse project and smoke-test startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          # The project-wide theme references an imported font. On a clean
          # checkout, Godot loads project settings before its first import
          # scan, so temporarily disable that theme while generating imports.
          test -s "assets/fonts/STIXTwoText[wght].ttf"
          test -s "Screenshot_20261104-041429_ChatGPT.jpg"
          if grep -R -n --exclude-dir=.git "digitalworld-landing.png" scripts scenes project.godot; then
            echo "A script or scene still references the deleted landing image."
            exit 1
          fi
          cp project.godot project.godot.ci-backup
          restore_project() {
            if [ -f project.godot.ci-backup ]; then
              mv project.godot.ci-backup project.godot
            fi
          }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          restore_project
          trap - EXIT

          if grep -E 'Parse Error:|SCRIPT ERROR:' godot-import.log; then
            echo "Godot reported a script error during asset import."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name 'STIXTwoText*.fontdata' -print -quit | grep -q .; then
            echo "Godot did not generate the imported STIX Two Text font resource."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name '*.ctex' -print -quit | grep -q .; then
            echo "Godot did not generate imported texture resources."
            exit 1
          fi

          # Reopen with the real project theme enabled and validate its resources.
          godot --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E 'Parse Error:|SCRIPT ERROR:' godot-parse.log; then
            echo "Godot reported a script error after imports were generated."
            exit 1
          fi

      - name: Smoke-test main scene startup
        shell: bash
        run: |
          set +e
          godot --headless --path . --quit-after 5 2>&1 | tee godot-startup.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot startup command exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -E 'Parse Error:|SCRIPT ERROR:' godot-startup.log; then
            echo "Godot reported a script error during startup."
            exit 1
          fi
