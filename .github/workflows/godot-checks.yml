name: DigitalWorld Godot Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect affected worksites
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      globe: ${{ steps.filter.outputs.globe }}
      camera: ${{ steps.filter.outputs.camera }}
      processor: ${{ steps.filter.outputs.processor }}
      research: ${{ steps.filter.outputs.research }}
      navigation: ${{ steps.filter.outputs.navigation }}
      lockscreen: ${{ steps.filter.outputs.lockscreen }}
      osmodel: ${{ steps.filter.outputs.osmodel }}
      xmorph: ${{ steps.filter.outputs.xmorph }}
      pin: ${{ steps.filter.outputs.pin }}
      homescreen: ${{ steps.filter.outputs.homescreen }}
      osboot: ${{ steps.filter.outputs.osboot }}
      matrix: ${{ steps.filter.outputs.matrix }}
      has_tests: ${{ steps.filter.outputs.has_tests }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "camera=true" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "No usable base commit; running the full smoke suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt

          python3 - <<'PY'
          from pathlib import Path

          changed = [line.strip() for line in Path("changed-files.txt").read_text().splitlines() if line.strip()]
          groups = {
              "globe": ("scripts/world/", "scenes/world_globe.tscn", "assets/globe/", "scripts/tests/world_globe_navigation_smoke.gd", "tools/build_globe_geography.py"),
              "camera": ("scripts/camera", "scenes/camera", "scripts/tests/camera_creation_worksite_smoke.gd", "scripts/screen_technology_system.gd"),
              "processor": ("scripts/processor", "scenes/processor", "scripts/tests/processor_worksite_smoke.gd"),
              "research": ("scripts/digitalworld_research_manager.gd", "scripts/*research_dashboard", "scenes/*research_dashboard", "scripts/tests/research_dashboard_smoke.gd"),
              "navigation": ("scripts/tests/home_transition_smoke.gd", "scripts/digitalworld_game.gd", "scenes/main.tscn"),
              "lockscreen": ("scripts/lock_screen_designer", "assets/lock-screen/", "scripts/tests/lock_screen_designer_smoke.gd"),
              "osmodel": ("scripts/os_worksite_phone_model.gd", "scripts/tests/os_worksite_phone_model_smoke.gd"),
              "xmorph": ("research/XMorphClock/", "assets/lock-screen/clocks/", "scripts/tests/xmorph_lock_screen_assets_smoke.gd"),
              "pin": ("scripts/tests/pin_entry_swipe_smoke.gd", "scripts/pin", "assets/system-ui/godot/pin-entry/"),
              "homescreen": ("scripts/home_screen", "scripts/tests/home_screen_smoke.gd", "assets/system-ui/android-systemui/"),
              "osboot": ("scripts/os_creation", "scripts/tests/os_creation_boot_lock_screen_smoke.gd", "scenes/os_creation")
          }

          selected = {name: False for name in groups}
          full = False
          for path in changed:
              matched = False
              for name, prefixes in groups.items():
                  if any(path.startswith(prefix.rstrip("*")) if "*" not in prefix else __import__("fnmatch").fnmatch(path, prefix) for prefix in prefixes):
                      selected[name] = True
                      matched = True
              if not matched:
                  full = True

          # Shared project configuration and workflow changes require broad regression.
          if any(path in ("project.godot", "export_presets.cfg") or path.startswith((".github/", "addons/", "scripts/tests/")) and not any(path == p for p in [
              "scripts/tests/world_globe_navigation_smoke.gd",
              "scripts/tests/camera_creation_worksite_smoke.gd",
              "scripts/tests/processor_worksite_smoke.gd",
              "scripts/tests/research_dashboard_smoke.gd",
              "scripts/tests/home_transition_smoke.gd",
              "scripts/tests/lock_screen_designer_smoke.gd",
              "scripts/tests/os_worksite_phone_model_smoke.gd",
              "scripts/tests/xmorph_lock_screen_assets_smoke.gd",
              "scripts/tests/pin_entry_swipe_smoke.gd",
              "scripts/tests/home_screen_smoke.gd",
              "scripts/tests/os_creation_boot_lock_screen_smoke.gd"
          ]) for path in changed):
              full = True

          # Unknown script/scene/asset changes may affect shared dependencies: be conservative.
          if any(path.startswith(("scripts/", "scenes/", "assets/")) and not any(
              any(path.startswith(prefix.rstrip("*")) if "*" not in prefix else __import__("fnmatch").fnmatch(path, prefix) for prefix in prefixes)
              for prefixes in groups.values()
          ) for path in changed):
              full = True

          import json
          tests = [
              ("navigation", "Home and Office navigation smoke test", "res://scripts/tests/home_transition_smoke.gd", "home-office-smoke.log", "HOME_OFFICE_TRANSITION_SMOKE_TEST: PASS"),
              ("research", "Research dashboards smoke test", "res://scripts/tests/research_dashboard_smoke.gd", "research-dashboard-smoke.log", "PHONE_CAMERA_PROCESSOR_RESEARCH_DASHBOARD_SMOKE_TEST: PASS"),
              ("processor", "Processor Worksite smoke test", "res://scripts/tests/processor_worksite_smoke.gd", "processor-worksite-smoke.log", "PROCESSOR_WORKSITE_SMOKE_TEST: PASS"),
              ("lockscreen", "Lock-screen designer smoke test", "res://scripts/tests/lock_screen_designer_smoke.gd", "lock-screen-designer-smoke.log", "HYBRID_LOCK_SCREEN_SMOKE_TEST: PASS"),
              ("osmodel", "OS handset model smoke test", "res://scripts/tests/os_worksite_phone_model_smoke.gd", "os-worksite-phone-model-smoke.log", "OS_WORKSITE_PHONE_MODEL_SMOKE_TEST: PASS"),
              ("xmorph", "XMorph lock-screen assets smoke test", "res://scripts/tests/xmorph_lock_screen_assets_smoke.gd", "xmorph-lock-screen-smoke.log", "XMORPH_LOCK_SCREEN_ASSETS_SMOKE_TEST: PASS"),
              ("pin", "PIN entry smoke test", "res://scripts/tests/pin_entry_swipe_smoke.gd", "pin-entry-smoke.log", "PIN_ENTRY_SWIPE_SMOKE_TEST: PASS"),
              ("homescreen", "One UI home screen smoke test", "res://scripts/tests/home_screen_smoke.gd", "home-screen-smoke.log", "ONE_UI_HOME_SCREEN_SMOKE_TEST: PASS"),
              ("osboot", "OS boot and lock-screen handoff smoke test", "res://scripts/tests/os_creation_boot_lock_screen_smoke.gd", "os-boot-lock-screen-smoke.log", "OS_BOOT_LOCK_SCREEN_SMOKE_TEST: PASS"),
              ("globe", "Earth globe and landing navigation smoke test", "res://scripts/tests/world_globe_navigation_smoke.gd", "world-globe-smoke.log", "WORLD_GLOBE_NAVIGATION_SMOKE_TEST: PASS", 120)
          ]
          matrix = []
          for group, name, script, log, marker, *timeout in tests:
              if full or selected[group]:
                  item = {"group": group, "name": name, "script": script, "log": log, "marker": marker}
                  if timeout:
                      item["timeout"] = timeout[0]
                  matrix.append(item)

          output_path = __import__("os").environ["GITHUB_OUTPUT"]
          with open(output_path, "a") as output:
              output.write(f"full={str(full).lower()}\\n")
              for name, value in selected.items():
                  output.write(f"{name}={str(value).lower()}\\n")
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\\n")
              output.write(f"has_tests={str(bool(matrix)).lower()}\\n")
          PY

  camera-worksite-smoke:
    if: needs.detect_changes.outputs.full == 'true' || needs.detect_changes.outputs.camera == 'true'
    needs: detect_changes
    name: Isolated Camera Creation Worksite smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Prepare isolated Camera Worksite project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-camera-worksite/scripts/tests .ci-camera-worksite/scenes .ci-camera-worksite/assets/fonts
          cp scripts/camera_creation_worksite.gd .ci-camera-worksite/scripts/
          cp scripts/camera_preview_studio.gd .ci-camera-worksite/scripts/
          cp scripts/camera_worksite_phone_model.gd .ci-camera-worksite/scripts/
          cp scripts/digitalworld_research_manager.gd .ci-camera-worksite/scripts/
          cp scripts/screen_technology_system.gd .ci-camera-worksite/scripts/
          cp scripts/os_worksite_phone_model.gd .ci-camera-worksite/scripts/
          cp scripts/tests/camera_creation_worksite_smoke.gd .ci-camera-worksite/scripts/tests/
          cp scenes/camera_creation_worksite.tscn .ci-camera-worksite/scenes/
          cp 'assets/fonts/STIXTwoText[wght].ttf' .ci-camera-worksite/assets/fonts/
          cat > .ci-camera-worksite/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Camera Creation Worksite Smoke Test"

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

      - name: Import isolated Camera Worksite assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path .ci-camera-worksite --import --quit 2>&1 | tee camera-worksite-import.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' camera-worksite-import.log; then
            echo "Godot reported an error while importing the isolated Camera Worksite project."
            exit 1
          fi

      - name: Smoke-test camera-less handset and worksite layout
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path .ci-camera-worksite --script res://scripts/tests/camera_creation_worksite_smoke.gd 2>&1 | tee camera-creation-worksite-smoke.log
          grep -q "CAMERA_CREATION_WORKSITE_SMOKE_TEST: PASS" camera-creation-worksite-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|CAMERA_CREATION_WORKSITE_SMOKE_TEST:.*(FAIL|ERROR)' camera-creation-worksite-smoke.log; then
            echo "Godot reported an error during the isolated Camera Worksite smoke test."
            exit 1
          fi

  validate:
    needs: detect_changes
    name: Validate Godot project and main startup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          test -s "assets/fonts/STIXTwoText[wght].ttf"
          test -s "assets/company_logos.svg"
          for asset in assets/textures/*.svg; do test -s "$asset"; done
          if grep -R -n --exclude-dir=.git "digitalworld-landing.png" scripts scenes project.godot; then
            echo "A script or scene still references the deleted landing image."
            exit 1
          fi
          cp project.godot project.godot.ci-backup
          restore_project() {
            if [ -f project.godot.ci-backup ]; then
              mv project.godot.ci-backup project.godot
            fi
          }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot

          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          restore_project
          trap - EXIT

          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-import.log; then
            echo "Godot reported a script error during asset import."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name 'STIXTwoText*.fontdata' -print -quit | grep -q .; then
            echo "Godot did not generate the imported STIX Two Text font resource."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name '*.ctex' -print -quit | grep -q .; then
            echo "Godot did not generate imported texture resources."
            exit 1
          fi

          godot --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-parse.log; then
            echo "Godot reported a script error after imports were generated."
            exit 1
          fi

      - name: Smoke-test main scene startup
        shell: bash
        run: |
          set +e
          godot --headless --path . --quit-after 5 2>&1 | tee godot-startup.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot startup command exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-startup.log; then
            echo "Godot reported a script error during startup."
            exit 1
          fi

  worksite-smoke-tests:
    needs: detect_changes
    if: needs.detect_changes.outputs.has_tests == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect_changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project assets
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci-backup
          restore_project() {
            if [ -f project.godot.ci-backup ]; then mv project.godot.ci-backup project.godot; fi
          }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot
          godot --headless --editor --path . --import --quit 2>&1 | tee smoke-import.log
          restore_project
          trap - EXIT
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' smoke-import.log; then
            echo "Godot reported an error while importing project assets."
            exit 1
          fi

      - name: Run this smoke test only
        shell: bash
        env:
          TEST_SCRIPT: ${{ matrix.script }}
          TEST_LOG: ${{ matrix.log }}
          PASS_MARKER: ${{ matrix.marker }}
          TEST_TIMEOUT: ${{ matrix.timeout || 0 }}
        run: |
          set -euo pipefail
          if [ "$TEST_TIMEOUT" -gt 0 ]; then
            set +e
            timeout --signal=TERM --kill-after=10s "${TEST_TIMEOUT}s" godot --headless --path . --script "$TEST_SCRIPT" 2>&1 | tee "$TEST_LOG"
            godot_status=${PIPESTATUS[0]}
            set -e
            if [ "$godot_status" -eq 124 ]; then
              echo "Smoke test timed out. Last progress marker:"
              grep -E 'SMOKE:' "$TEST_LOG" | tail -n 1 || true
              exit 124
            fi
            if [ "$godot_status" -ne 0 ]; then exit "$godot_status"; fi
          else
            godot --headless --path . --script "$TEST_SCRIPT" 2>&1 | tee "$TEST_LOG"
          fi
          grep -Fq "$PASS_MARKER" "$TEST_LOG"
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|SMOKE_TEST:.*(FAIL|ERROR)' "$TEST_LOG"; then
            echo "Godot reported an error during this smoke test."
            exit 1
          fi

