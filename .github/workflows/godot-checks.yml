name: DigitalWorld Godot Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Parse project and smoke-test startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          test -s "assets/fonts/STIXTwoText[wght].ttf"
          test -s "assets/company_logos.svg"
          for asset in assets/textures/*.svg; do test -s "$asset"; done
          if grep -R -n --exclude-dir=.git "digitalworld-landing.png" scripts scenes project.godot; then
            echo "A script or scene still references the deleted landing image."
            exit 1
          fi
          cp project.godot project.godot.ci-backup
          restore_project() {
            if [ -f project.godot.ci-backup ]; then
              mv project.godot.ci-backup project.godot
            fi
          }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot

          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          restore_project
          trap - EXIT

          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-import.log; then
            echo "Godot reported a script error during asset import."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name 'STIXTwoText*.fontdata' -print -quit | grep -q .; then
            echo "Godot did not generate the imported STIX Two Text font resource."
            exit 1
          fi
          if ! find .godot/imported -maxdepth 1 -type f -name '*.ctex' -print -quit | grep -q .; then
            echo "Godot did not generate imported texture resources."
            exit 1
          fi

          godot --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-parse.log; then
            echo "Godot reported a script error after imports were generated."
            exit 1
          fi

      - name: Smoke-test Home and Office navigation
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/home_transition_smoke.gd 2>&1 | tee home-office-smoke.log
          grep -q "HOME_OFFICE_TRANSITION_SMOKE_TEST: PASS" home-office-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|HOME_OFFICE_TRANSITION_SMOKE_TEST:.*(FAIL|ERROR)' home-office-smoke.log; then
            echo "Godot reported an error during Home and Office navigation."
            exit 1
          fi

      - name: Smoke-test UI Evolution generator and live 3D phone screen
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://scripts/tests/ui_evolution_smoke.gd 2>&1 | tee ui-evolution-smoke.log
          grep -q "UI_EVOLUTION_SMOKE_TEST: PASS" ui-evolution-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|UI_EVOLUTION_SMOKE_TEST:.*(FAIL|ERROR)' ui-evolution-smoke.log; then
            echo "Godot reported an error during UI Evolution generation or phone-screen integration."
            exit 1
          fi

      - name: Smoke-test Processor Worksite and 3D chip preview
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/processor_worksite_smoke.gd 2>&1 | tee processor-worksite-smoke.log
          grep -q "PROCESSOR_WORKSITE_SMOKE_TEST: PASS" processor-worksite-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|PROCESSOR_WORKSITE_SMOKE_TEST:.*(FAIL|ERROR)' processor-worksite-smoke.log; then
            echo "Godot reported an error during the Processor Worksite smoke test."
            exit 1
          fi

      - name: Smoke-test OS handset geometry and display surface
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/os_worksite_phone_model_smoke.gd 2>&1 | tee os-worksite-phone-model-smoke.log
          grep -q "OS_WORKSITE_PHONE_MODEL_SMOKE_TEST: PASS" os-worksite-phone-model-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|OS_WORKSITE_PHONE_MODEL_SMOKE_TEST:.*(FAIL|ERROR)' os-worksite-phone-model-smoke.log; then
            echo "Godot reported an error during the OS handset model smoke test."
            exit 1
          fi

      - name: Smoke-test hybrid autonomous lock-screen layouts and assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/lock_screen_designer_smoke.gd 2>&1 | tee lock-screen-designer-smoke.log
          grep -q "HYBRID_LOCK_SCREEN_SMOKE_TEST: PASS" lock-screen-designer-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|HYBRID_LOCK_SCREEN_SMOKE_TEST:.*(FAIL|ERROR)' lock-screen-designer-smoke.log; then
            echo "Godot reported an error during the hybrid lock-screen smoke test."
            exit 1
          fi

      - name: Smoke-test lock-screen swipe-up PIN entry
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/pin_entry_swipe_smoke.gd 2>&1 | tee pin-entry-smoke.log
          grep -q "PIN_ENTRY_SWIPE_SMOKE_TEST: PASS" pin-entry-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|PIN_ENTRY_SWIPE_SMOKE_TEST:.*(FAIL|ERROR)' pin-entry-smoke.log; then
            echo "Godot reported an error during lock-screen PIN entry."
            exit 1
          fi

      - name: Smoke-test One UI home screen, status bar and app drawer
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/home_screen_smoke.gd 2>&1 | tee home-screen-smoke.log
          grep -q "ONE_UI_HOME_SCREEN_SMOKE_TEST: PASS" home-screen-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|ONE_UI_HOME_SCREEN_SMOKE_TEST:.*(FAIL|ERROR)' home-screen-smoke.log; then
            echo "Godot reported an error during the One UI home-screen smoke test."
            exit 1
          fi

      - name: Smoke-test OS boot and automatic lock-screen handoff
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/tests/os_creation_boot_lock_screen_smoke.gd 2>&1 | tee os-boot-lock-screen-smoke.log
          grep -q "OS_BOOT_LOCK_SCREEN_SMOKE_TEST: PASS" os-boot-lock-screen-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|OS_BOOT_LOCK_SCREEN_SMOKE_TEST:.*(FAIL|ERROR)' os-boot-lock-screen-smoke.log; then
            echo "Godot reported an error during the OS boot and lock-screen transition smoke test."
            exit 1
          fi

      - name: Smoke-test main scene startup
        shell: bash
        run: |
          set +e
          godot --headless --path . --quit-after 5 2>&1 | tee godot-startup.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot startup command exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-startup.log; then
            echo "Godot reported a script error during startup."
            exit 1
          fi

      - name: Report Godot warnings (non-blocking)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          logs=(godot-import.log godot-parse.log home-office-smoke.log ui-evolution-smoke.log processor-worksite-smoke.log os-worksite-phone-model-smoke.log lock-screen-designer-smoke.log pin-entry-smoke.log home-screen-smoke.log os-boot-lock-screen-smoke.log godot-startup.log)
          warning_count=0

          for log in "${logs[@]}"; do
            [ -f "$log" ] || continue
            matches="$(grep -nE 'WARNING:|^[[:space:]]*W [0-9]+:' "$log" || true)"
            [ -n "$matches" ] || continue

            echo "::group::Godot warnings from $log"
            while IFS= read -r warning; do
              printf '::warning::%s\n' "$log: $warning"
              warning_count=$((warning_count + 1))
            done <<< "$matches"
            echo "::endgroup::"
          done

          echo "Godot warning lines reported: $warning_count"
          echo "Warnings are informational and do not fail this workflow."
