name: DigitalWorld Godot Checks

on:
  push:
    branches:
      - main
      - upload-atlas-splat
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-worksite-smoke:
    name: Isolated Camera Creation Worksite smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Prepare isolated Camera Worksite project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-camera-worksite/scripts/tests .ci-camera-worksite/scenes .ci-camera-worksite/assets/fonts
          cp scripts/camera_creation_worksite.gd .ci-camera-worksite/scripts/
          cp scripts/camera_preview_studio.gd .ci-camera-worksite/scripts/
          cp scripts/camera_worksite_phone_model.gd .ci-camera-worksite/scripts/
          cp scripts/digitalworld_research_manager.gd .ci-camera-worksite/scripts/
          cp scripts/screen_technology_system.gd .ci-camera-worksite/scripts/
          cp scripts/os_worksite_phone_model.gd .ci-camera-worksite/scripts/
          cp scripts/tests/camera_creation_worksite_smoke.gd .ci-camera-worksite/scripts/tests/
          cp scenes/camera_creation_worksite.tscn .ci-camera-worksite/scenes/
          cp 'assets/fonts/STIXTwoText[wght].ttf' .ci-camera-worksite/assets/fonts/
          cat > .ci-camera-worksite/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Camera Creation Worksite Smoke Test"

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

      - name: Import isolated Camera Worksite assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path .ci-camera-worksite --import --quit 2>&1 | tee camera-worksite-import.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' camera-worksite-import.log; then
            echo "Godot reported an error while importing the isolated Camera Worksite project."
            exit 1
          fi

      - name: Smoke-test camera-less handset and worksite layout
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path .ci-camera-worksite --script res://scripts/tests/camera_creation_worksite_smoke.gd 2>&1 | tee camera-creation-worksite-smoke.log
          grep -q "CAMERA_CREATION_WORKSITE_SMOKE_TEST: PASS" camera-creation-worksite-smoke.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:|CAMERA_CREATION_WORKSITE_SMOKE_TEST:.*(FAIL|ERROR)' camera-creation-worksite-smoke.log; then
            echo "Godot reported an error during the isolated Camera Worksite smoke test."
            exit 1
          fi

  project-import-parse:
    name: Import resources and parse project
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          test -s "assets/fonts/STIXTwoText[wght].ttf"
          test -s assets/company_logos.svg
          for asset in assets/textures/*.svg; do test -s "$asset"; done
          if grep -R -n --exclude-dir=.git "digitalworld-landing.png" scripts scenes project.godot; then exit 1; fi
          cp project.godot project.godot.ci-backup
          restore_project() { if [ -f project.godot.ci-backup ]; then mv project.godot.ci-backup project.godot; fi; }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          restore_project
          trap - EXIT
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-import.log; then exit 1; fi
          test -n "$(find .godot/imported -maxdepth 1 -type f -name 'STIXTwoText*.fontdata' -print -quit)"
          test -n "$(find .godot/imported -maxdepth 1 -type f -name '*.ctex' -print -quit)"
          godot --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-parse.log; then exit 1; fi

  home-office-smoke:
    name: Home and Office navigation
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Home and Office navigation
      script_path: scripts/tests/home_transition_smoke.gd
      pass_marker: "HOME_OFFICE_TRANSITION_SMOKE_TEST: PASS"
      log_name: home-office-smoke.log

  research-dashboard-smoke:
    name: Phone, Camera and Processor Research dashboards
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Phone, Camera and Processor Research dashboards
      script_path: scripts/tests/research_dashboard_smoke.gd
      pass_marker: "PHONE_CAMERA_PROCESSOR_RESEARCH_DASHBOARD_SMOKE_TEST: PASS"
      log_name: research-dashboard-smoke.log

  processor-worksite-smoke:
    name: Processor Worksite and 3D chip preview
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Processor Worksite and 3D chip preview
      script_path: scripts/tests/processor_worksite_smoke.gd
      pass_marker: "PROCESSOR_WORKSITE_SMOKE_TEST: PASS"
      log_name: processor-worksite-smoke.log

  camera-creation-smoke:
    name: Camera Creation Worksite full-project smoke test
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Camera Creation Worksite full-project smoke test
      script_path: scripts/tests/camera_creation_worksite_smoke.gd
      pass_marker: "CAMERA_CREATION_WORKSITE_SMOKE_TEST: PASS"
      log_name: camera-creation-worksite-smoke.log

  lock-screen-designer-smoke:
    name: Hybrid lock-screen designer
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Hybrid lock-screen designer
      script_path: scripts/tests/lock_screen_designer_smoke.gd
      pass_marker: "HYBRID_LOCK_SCREEN_SMOKE_TEST: PASS"
      log_name: lock-screen-designer-smoke.log

  os-phone-model-smoke:
    name: OS handset geometry and display surface
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: OS handset geometry and display surface
      script_path: scripts/tests/os_worksite_phone_model_smoke.gd
      pass_marker: "OS_WORKSITE_PHONE_MODEL_SMOKE_TEST: PASS"
      log_name: os-worksite-phone-model-smoke.log

  xmorph-lock-screen-smoke:
    name: XMorph clocks, media player and notifications
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: XMorph clocks, media player and notifications
      script_path: scripts/tests/xmorph_lock_screen_assets_smoke.gd
      pass_marker: "XMORPH_LOCK_SCREEN_ASSETS_SMOKE_TEST: PASS"
      log_name: xmorph-lock-screen-smoke.log

  pin-entry-smoke:
    name: Lock-screen swipe-up PIN entry
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Lock-screen swipe-up PIN entry
      script_path: scripts/tests/pin_entry_swipe_smoke.gd
      pass_marker: "PIN_ENTRY_SWIPE_SMOKE_TEST: PASS"
      log_name: pin-entry-smoke.log

  home-screen-smoke:
    name: One UI home screen and app drawer
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: One UI home screen and app drawer
      script_path: scripts/tests/home_screen_smoke.gd
      pass_marker: "ONE_UI_HOME_SCREEN_SMOKE_TEST: PASS"
      log_name: home-screen-smoke.log

  os-boot-lock-screen-smoke:
    name: OS boot and automatic lock-screen handoff
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: OS boot and automatic lock-screen handoff
      script_path: scripts/tests/os_creation_boot_lock_screen_smoke.gd
      pass_marker: "OS_BOOT_LOCK_SCREEN_SMOKE_TEST: PASS"
      log_name: os-boot-lock-screen-smoke.log

  world-globe-smoke:
    name: Standalone online Earth globe
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Standalone online Earth globe
      script_path: scripts/tests/world_globe_smoke.gd
      pass_marker: "WORLD_GLOBE_SMOKE_TEST: PASS"
      log_name: world-globe-smoke.log

  gaussian-splat-office-smoke:
    name: Gaussian Splat office preview
    uses: ./.github/workflows/godot-smoke-test.yml
    with:
      test_name: Gaussian Splat office preview
      script_path: scripts/tests/gaussian_splat_office_smoke.gd
      pass_marker: "GAUSSIAN_SPLAT_OFFICE_SMOKE_TEST: PASS"
      log_name: gaussian-splat-office-smoke.log
      include_gaussian_asset: true

  main-scene-startup:
    name: Main scene startup
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci-backup
          restore_project() { if [ -f project.godot.ci-backup ]; then mv project.godot.ci-backup project.godot; fi; }
          trap restore_project EXIT
          sed -i '/^theme\/custom=/d' project.godot
          godot --headless --editor --path . --import --quit
      - name: Smoke-test main scene startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-startup.log
          if grep -E 'Parse Error:|SCRIPT ERROR:|ERROR:' godot-startup.log; then exit 1; fi
