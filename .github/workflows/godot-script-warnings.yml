name: DigitalWorld GDScript Warning Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdscript-warning-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warning-scan:
    name: Report GDScript warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Report Godot version
        run: godot --version

      - name: Prepare project cache (non-blocking)
        shell: bash
        run: |
          set +e
          cp project.godot project.godot.ci-backup
          sed -i '/^theme\/custom=/d' project.godot
          timeout --signal=TERM --kill-after=2s 60s godot --headless --editor --path . --import --quit > godot-import.log 2>&1
          import_status=$?
          mv project.godot.ci-backup project.godot
          echo "Project preparation exit code: $import_status (not used to fail this warning-only workflow)."

      - name: Scan every GDScript file for warnings
        shell: bash
        run: |
          set +e
          : > gdscript-warning-scan.log

          mapfile -d '' scripts < <(
            find . -type f -name '*.gd' \
              -not -path './.git/*' \
              -not -path './.godot/*' \
              -print0 | sort -z
          )

          echo "Found ${#scripts[@]} GDScript files."
          echo "Running Godot's GDScript parser with warning output enabled."

          for script in "${scripts[@]}"; do
            relative_path="${script#./}"
            resource_path="res://${relative_path}"
            echo "===== ${resource_path} =====" >> gdscript-warning-scan.log

            # --debug makes Godot print ordinary GDScript warnings.
            # --check-only parses the selected file without running the game.
            # A timeout prevents a parse-error debugger from holding CI open.
            timeout --signal=TERM --kill-after=1s 5s \
              godot --headless --path . --check-only --script "${resource_path}" --debug \
              >> gdscript-warning-scan.log 2>&1
            command_status=$?

            if [ "$command_status" -eq 124 ] || [ "$command_status" -eq 137 ]; then
              echo "Godot parser timed out for ${resource_path}; continuing warning scan." >> gdscript-warning-scan.log
            fi
          done

          echo "Completed warning-only scan of ${#scripts[@]} GDScript files."
          cat gdscript-warning-scan.log

      - name: Report unique warnings (informational only)
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("gdscript-warning-scan.log")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines() if log_path.exists() else []
          warning_pattern = re.compile(r"WARNING:\\s*(.*)")
          location_pattern = re.compile(r"res://([^):]+):(\\d+)")
          warnings = {}

          for index, line in enumerate(lines):
              match = warning_pattern.search(line)
              if not match:
                  continue

              message = match.group(1).strip()
              source_file = ""
              source_line = ""

              for context in lines[index + 1:index + 4]:
                  location = location_pattern.search(context)
                  if location:
                      source_file = location.group(1)
                      source_line = location.group(2)
                      break

              key = (source_file, source_line, message)
              warnings.setdefault(key, None)

          for (source_file, source_line, message) in warnings:
              if source_file and source_line:
                  print(f"::warning file={source_file},line={source_line}::{message}")
              else:
                  print(f"::warning::{message}")

          print(f"Unique Godot GDScript warnings reported: {len(warnings)}")
          print("Warnings are informational. This workflow does not fail on app errors or warnings.")
          PY
