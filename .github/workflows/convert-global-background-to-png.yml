name: Convert global background to PNG

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert-background:
    if: github.event.head_commit.message != 'Convert global background JPG to PNG'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert original photograph to PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = "Screenshot_20261104-041429_ChatGPT.jpg"
          target = "Screenshot_20261104-041429_ChatGPT.png"
          with Image.open(source) as image:
              image.convert("RGB").save(target, format="PNG", optimize=True)
          print(f"Converted {source} to {target}")
          PY

      - name: Update project references and remove JPG
        run: |
          grep -RIl --include='*.gd' --include='*.tscn' --include='*.tres' --include='*.godot' 'Screenshot_20261104-041429_ChatGPT.jpg' . | while read -r file; do
            sed -i 's/Screenshot_20261104-041429_ChatGPT\.jpg/Screenshot_20261104-041429_ChatGPT.png/g' "$file"
          done
          rm -f Screenshot_20261104-041429_ChatGPT.jpg
          rm -f Screenshot_20261104-041429_ChatGPT.jpg.import

      - name: Commit converted PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert global background JPG to PNG"
          git push origin main
